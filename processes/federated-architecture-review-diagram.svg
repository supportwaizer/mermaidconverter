  <!-- Edge labels -->
  <g fill="#37474F" font-size="9" font-weight="bold">
    <text x="392" y="255" text-anchor="end">No</text>
    <text x="530" y="360">Yes</text>
    <text x="752" y="230">Deviations</text>
    <text x="806" y="270">Yes</text>
    <text x="1034" y="150">No exception</text>
    <text x="1034" y="340">Exception / gap /</text>
    <text x="1034" y="352">mandatory category</text>
    <text x="1454" y="620">Approved</text>
