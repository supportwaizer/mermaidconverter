  <text transform="translate(60,145) rotate(-90)" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">APT / Design Owner</text>
  <rect x="10" y="230" width="100" height="200" fill="#5E35B1"/>
  <text transform="translate(53,330) rotate(-90)" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">Architecture</text>
  <text transform="translate(69,330) rotate(-90)" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">Review Agent</text>
  <text transform="translate(84,330) rotate(-90)" fill="#D1C4E9" font-size="9" text-anchor="middle">(automated)</text>
  <rect x="10" y="430" width="100" height="170" fill="#37474F"/>
  <text transform="translate(60,515) rotate(-90)" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">SA</text>
