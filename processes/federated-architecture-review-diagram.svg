  <text transform="translate(60,810) rotate(-90)" fill="#FFFFFF" font-size="12" font-weight="bold" text-anchor="middle">IT Governance</text>

  <!-- ===== Lane 1: APT / Design Owner ===== -->
  <g fill="#C8E6C9" stroke="#2E7D32" stroke-width="1.5">
    <rect x="130" y="88" width="116" height="56" rx="3"/>
    <rect x="410" y="158" width="116" height="56" rx="3"/>
    <rect x="830" y="158" width="116" height="56" rx="3"/>
    <rect x="1110" y="88" width="116" height="56" rx="3"/>
    <rect x="1670" y="88" width="116" height="56" rx="3"/>
  </g>
  <g fill="#1B5E20" font-size="10" text-anchor="middle">
    <text x="188" y="112">Submit design</text><text x="188" y="125">package</text>
    <text x="468" y="182">Provide missing</text><text x="468" y="195">details</text>
    <text x="888" y="182">Remediate</text><text x="888" y="195">design</text>
    <text x="1168" y="112">Self-certify</text><text x="1168" y="125">&amp; attest</text>
    <text x="1728" y="112">Create PL2</text><text x="1728" y="125">entry</text>
  </g>

