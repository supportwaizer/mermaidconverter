    <line x1="270" y1="899" x2="310" y2="899" stroke="#6D4C41" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="318" y="903">Assurance feedback</text>
    <text x="470" y="903">Agent lane is advisory: every approval and attestation is owned by a named person.</text>
