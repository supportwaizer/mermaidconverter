    <text x="468" y="274">Automated</text><text x="468" y="287">readiness check</text>
    <text x="608" y="268">Self-review vs</text><text x="608" y="281">published</text><text x="608" y="294">standards</text>
    <text x="1588" y="274">Generate</text><text x="1588" y="287">evidence pack</text>
