    <text x="748" y="281">Conformant?</text>
    <text x="1028" y="274">Exception, gap,</text><text x="1028" y="286">or mandatory?</text>
  </g>

  <!-- ===== Lane 3: SA ===== -->
  <g fill="#CFD8DC" stroke="#37474F" stroke-width="1.5">
    <rect x="1110" y="450" width="116" height="56" rx="3"/>
    <rect x="1390" y="450" width="116" height="56" rx="3"/>
    <rect x="1810" y="450" width="116" height="56" rx="3"/>
    <rect x="1810" y="525" width="116" height="56" rx="3"/>
  </g>
  <g fill="#263238" font-size="10" text-anchor="middle">
    <text x="1168" y="468">Targeted review</text><text x="1168" y="481">scoped to the</text><text x="1168" y="494">exception</text>
    <text x="1448" y="468">Document ODT</text><text x="1448" y="481">&amp; exception</text><text x="1448" y="494">decisions</text>
    <text x="1868" y="468">Close Jira tasks</text><text x="1868" y="481">ar-complete</text>
    <text x="1868" y="543">Sampling audit of</text><text x="1868" y="556">self-certified</text><text x="1868" y="569">designs</text>
  </g>

  <!-- ===== Lane 4: ODT ===== -->
  <g fill="#BBDEFB" stroke="#1565C0" stroke-width="1.5">
    <rect x="1250" y="630" width="116" height="56" rx="3"/>
  </g>
  <path d="M1448,626 L1498,658 L1448,690 L1398,658 Z" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <g fill="#0D47A1" font-size="10" text-anchor="middle">
    <text x="1308" y="654">ODT technical</text><text x="1308" y="667">review</text>
  </g>
  <text x="1448" y="661" fill="#0D47A1" font-size="9" text-anchor="middle">Approved?</text>

  <!-- ===== Lane 5: IT Governance ===== -->
  <rect x="1670" y="770" width="116" height="56" rx="3" fill="#FFE0B2" stroke="#E65100" stroke-width="1.5"/>
  <path d="M1868,766 L1926,798 L1868,830 L1810,798 Z" fill="#FFF3E0" stroke="#E65100" stroke-width="1.5"/>
  <g fill="#BF360C" font-size="10" text-anchor="middle">
    <text x="1728" y="794">Governance</text><text x="1728" y="807">review</text>
  </g>
  <text x="1868" y="801" fill="#BF360C" font-size="9" text-anchor="middle">Approved?</text>

