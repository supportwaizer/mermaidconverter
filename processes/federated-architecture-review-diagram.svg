<svg xmlns="http://www.w3.org/2000/svg" width="1980" height="930" viewBox="0 0 1980 930" font-family="Segoe UI, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474F"/>
    </marker>
    <marker id="arD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6D4C41"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1980" height="930" fill="#FFFFFF"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="1980" height="50" fill="#1F4E79"/>
  <text x="20" y="32" fill="#FFFFFF" font-size="20" font-weight="bold">Architecture Review — Federated Self-Review Process</text>

  <!-- Lane bodies -->
  <rect x="110" y="60" width="1850" height="170" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="1"/>
  <rect x="110" y="230" width="1850" height="200" fill="#FAF7FF" stroke="#B0BEC5" stroke-width="1"/>
  <rect x="110" y="430" width="1850" height="170" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="1"/>
  <rect x="110" y="600" width="1850" height="140" fill="#F7FAFF" stroke="#B0BEC5" stroke-width="1"/>
  <rect x="110" y="740" width="1850" height="140" fill="#FFFFFF" stroke="#B0BEC5" stroke-width="1"/>

  <!-- Lane labels -->
